<title>Personnel de l'hôpital</title>
<style>
  :root{--brand:#0f4c81;--brand-light:#e8f0f8;--ok:#1a9e5c;--danger:#c0392b;}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f8;margin:0;padding:0;color:#1f2937}
  header{background:var(--brand);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10}
  header h1{margin:0;font-size:1.15rem}
  header .back{color:#cfe3f7;text-decoration:none;font-size:.85rem}
  #status-banner{padding:8px 16px;font-size:.85rem;text-align:center;display:none}
  #status-banner.offline{display:block;background:#fdecea;color:#c0392b}
  #status-banner.queued{display:block;background:#fff8e1;color:#8a6d00}
  main{max-width:640px;margin:0 auto;padding:16px}
  .group{background:#fff;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .group h2{font-size:.95rem;color:var(--brand);margin:0 0 12px;border-bottom:1px solid #eef1f4;padding-bottom:8px}
  .field{margin-bottom:16px}
  .field label.qlabel{display:block;font-size:.92rem;font-weight:600;margin-bottom:8px;line-height:1.35}
  .req{color:var(--danger)}
  .options{display:flex;flex-direction:column;gap:6px}
  .opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #dfe4ea;border-radius:10px;cursor:pointer;font-size:.9rem}
  .opt input{accent-color:var(--brand)}
  .opt.selected{border-color:var(--brand);background:var(--brand-light)}
  select, input[type=text], input[type=number], textarea{width:100%;padding:10px;border:1px solid #dfe4ea;border-radius:10px;font-size:.95rem;font-family:inherit}
  .hint{font-size:.78rem;color:#6b7280;margin-top:4px}
  textarea{min-height:70px;resize:vertical}
  .hidden{display:none !important}
  .actions{position:sticky;bottom:0;background:#f4f6f8;padding:14px 0;margin-top:6px}
  button{width:100%;padding:14px;border:none;border-radius:12px;background:var(--brand);color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6}
  button.secondary{background:#fff;color:var(--brand);border:1px solid var(--brand);margin-top:8px}
  .error-msg{color:var(--danger);font-size:.85rem;margin-top:8px;display:none}
  .toast{position:fixed;left:16px;right:16px;bottom:16px;background:#1f2937;color:#fff;padding:14px;border-radius:12px;text-align:center;display:none;z-index:50}
  .queue-count{background:#8a6d00;color:#fff;border-radius:999px;padding:1px 8px;font-size:.75rem;margin-left:6px}
  .group.intro{background:#e8f0f8}.group.intro p{margin:0;font-size:.95rem}
  .field.note p{margin:0;font-size:.92rem;color:#374151;background:#f4f6f8;border-radius:10px;padding:10px}
  .options.row{flex-direction:row;flex-wrap:wrap}.options.row .opt{flex:1 1 40%}
  .ferr{color:#c0392b;font-size:.8rem;margin-top:4px}
  @media (min-width:900px){main{max-width:760px}}
</style>
